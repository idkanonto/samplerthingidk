name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-vst3:
    name: Windows Release VST3
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure Release build
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_BUILD_EXAMPLES=OFF
          -DJUCE_BUILD_EXTRAS=OFF

      - name: Build VST3, standalone, and tests
        run: cmake --build build --config Release --target RandomChopSampler_VST3 RandomChopSampler_Standalone RandomChopSamplerTests --parallel

      - name: Install MP3 fixture encoder
        run: choco install ffmpeg --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: |
          $mp3 = Join-Path $env:RUNNER_TEMP 'random-chop-format-fixture.mp3'
          ffmpeg -hide_banner -loglevel error -f lavfi `
            -i 'sine=frequency=440:sample_rate=48000:duration=0.1' `
            -ac 2 -y $mp3
          if (-not (Test-Path -LiteralPath $mp3 -PathType Leaf) -or
              (Get-Item -LiteralPath $mp3).Length -eq 0) {
            throw "Failed to create the MP3 decoder fixture: $mp3"
          }
          $env:RANDOM_CHOP_TEST_MP3 = $mp3
          $renderDir = Join-Path $env:GITHUB_WORKSPACE 'build\listening-renders'
          New-Item -ItemType Directory -Force -Path $renderDir | Out-Null
          $env:RANDOM_CHOP_RENDER_DIR = $renderDir
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify listening renders
        shell: pwsh
        run: |
          $renderDir = Join-Path $env:GITHUB_WORKSPACE 'build\listening-renders'
          $renders = Get-ChildItem -LiteralPath $renderDir -Filter '*.wav' -File
          if ($renders.Count -ne 16) {
            throw "Expected 16 deterministic listening renders, found $($renders.Count)."
          }
          foreach ($render in $renders) {
            if ($render.Length -eq 0) {
              throw "Listening render is empty: $($render.FullName)"
            }
          }
          $renders | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Verify artifact
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'build\RandomChopSampler_artefacts\Release\VST3\recompiler.dll.vst3'
          if (-not (Test-Path -LiteralPath $plugin -PathType Container)) {
            throw "Expected VST3 bundle was not produced: $plugin"
          }
          $module = Get-ChildItem -LiteralPath $plugin -Recurse -Filter '*.vst3' -File
          if ($module.Count -lt 1) {
            throw "The VST3 bundle does not contain a module binary."
          }
          $standalone = Join-Path $env:GITHUB_WORKSPACE 'build\RandomChopSampler_artefacts\Release\Standalone\recompiler.dll.exe'
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf) -or
              (Get-Item -LiteralPath $standalone).Length -eq 0) {
            throw "Expected standalone executable was not produced: $standalone"
          }
          $requiredNotices = @(
            'THIRD_PARTY_NOTICES.md',
            'JUCE_LICENSE.md',
            'SIGNALSMITH_LINEAR_LICENSE.txt'
          )
          foreach ($noticeName in $requiredNotices) {
            $notice = Join-Path $plugin "Contents\Resources\$noticeName"
            if (-not (Test-Path -LiteralPath $notice -PathType Leaf) -or
                (Get-Item -LiteralPath $notice).Length -eq 0) {
              throw "The VST3 bundle is missing required notice: $noticeName"
            }
          }
          Write-Host "Verified $plugin"
          $module | ForEach-Object { Write-Host "Module: $($_.FullName) ($($_.Length) bytes)" }
          Write-Host "Standalone: $standalone ($((Get-Item -LiteralPath $standalone).Length) bytes)"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $projectText = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'CMakeLists.txt')
          $versionMatch = [regex]::Match($projectText, 'project\(RandomChopSampler VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $versionMatch.Success) {
            throw 'Could not read the installer version from CMakeLists.txt.'
          }

          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler was not found: $compiler"
          }

          $definition = "/DAppVersion=$($versionMatch.Groups[1].Value)"
          $script = Join-Path $env:GITHUB_WORKSPACE 'installer\recompiler.iss'
          & $compiler $definition $script
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'build\installer\recompiler-dll-Windows-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf) -or
              (Get-Item -LiteralPath $setup).Length -eq 0) {
            throw "Expected installer was not produced: $setup"
          }

          $sourcePlugin = Join-Path $env:GITHUB_WORKSPACE 'build\RandomChopSampler_artefacts\Release\VST3\recompiler.dll.vst3'
          $sourceStandalone = Join-Path $env:GITHUB_WORKSPACE 'build\RandomChopSampler_artefacts\Release\Standalone\recompiler.dll.exe'
          $installedPlugin = Join-Path $env:CommonProgramFiles 'VST3\recompiler.dll.vst3'
          $installedRoot = Join-Path $env:ProgramFiles 'recompiler.dll'
          $installedStandalone = Join-Path $installedRoot 'recompiler.dll.exe'

          if ((Test-Path -LiteralPath $installedPlugin) -or
              (Test-Path -LiteralPath $installedRoot)) {
            throw 'Disposable runner unexpectedly contains a previous recompiler.dll installation.'
          }

          $install = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/MERGETASKS=!desktopicon' `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)."
          }

          foreach ($sourceFile in Get-ChildItem -LiteralPath $sourcePlugin -Recurse -File) {
            $relativePath = [System.IO.Path]::GetRelativePath($sourcePlugin, $sourceFile.FullName)
            $installedFile = Join-Path $installedPlugin $relativePath
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw "Installer omitted VST3 bundle file: $relativePath"
            }
            $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourceFile.FullName).Hash
            $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedFile).Hash
            if ($sourceHash -ne $installedHash) {
              throw "Installed VST3 bundle file differs from the build: $relativePath"
            }
          }

          if (-not (Test-Path -LiteralPath $installedStandalone -PathType Leaf)) {
            throw 'Installer omitted the Standalone executable.'
          }
          $sourceStandaloneHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourceStandalone).Hash
          $installedStandaloneHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedStandalone).Hash
          if ($sourceStandaloneHash -ne $installedStandaloneHash) {
            throw 'Installed Standalone executable differs from the build.'
          }

          $uninstaller = Join-Path $installedRoot 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'Installer did not create an uninstaller.'
          }

          $uninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
            -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)."
          }

          for ($attempt = 0; $attempt -lt 20; ++$attempt) {
            if (-not (Test-Path -LiteralPath $installedPlugin) -and
                -not (Test-Path -LiteralPath $installedStandalone)) {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if ((Test-Path -LiteralPath $installedPlugin) -or
              (Test-Path -LiteralPath $installedStandalone)) {
            throw 'Uninstaller left installed recompiler.dll files behind.'
          }

          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $setup
          $checksum = Join-Path (Split-Path -Parent $setup) 'recompiler-dll-Windows-Setup.exe.sha256'
          "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($setup))" |
            Set-Content -LiteralPath $checksum -Encoding ascii -NoNewline
          Write-Host "Installer: $setup ($((Get-Item -LiteralPath $setup).Length) bytes)"
          Write-Host "Installer SHA256: $($hash.Hash.ToLowerInvariant())"

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: recompiler-dll-Windows-VST3
          # Upload the parent so the downloaded archive preserves the required
          # top-level "recompiler.dll.vst3" bundle directory.
          path: build/RandomChopSampler_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: recompiler-dll-Windows-Installer
          path: |
            build/installer/recompiler-dll-Windows-Setup.exe
            build/installer/recompiler-dll-Windows-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload listening renders
        uses: actions/upload-artifact@v7
        with:
          name: recompiler-dll-listening-renders
          path: build/listening-renders
          if-no-files-found: error
          retention-days: 14
