name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-vst3:
    name: Windows Release VST3
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure Release build
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_BUILD_EXAMPLES=OFF
          -DJUCE_BUILD_EXTRAS=OFF

      - name: Build VST3, standalone, and tests
        run: cmake --build build --config Release --target RandomChopSampler_VST3 RandomChopSampler_Standalone RandomChopSamplerTests --parallel

      - name: Install MP3 fixture encoder
        run: choco install ffmpeg --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: |
          $mp3 = Join-Path $env:RUNNER_TEMP 'random-chop-format-fixture.mp3'
          ffmpeg -hide_banner -loglevel error -f lavfi `
            -i 'sine=frequency=440:sample_rate=48000:duration=0.1' `
            -ac 2 -y $mp3
          if (-not (Test-Path -LiteralPath $mp3 -PathType Leaf) -or
              (Get-Item -LiteralPath $mp3).Length -eq 0) {
            throw "Failed to create the MP3 decoder fixture: $mp3"
          }
          $env:RANDOM_CHOP_TEST_MP3 = $mp3
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify artifact
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'build\RandomChopSampler_artefacts\Release\VST3\Random Chop Sampler.vst3'
          if (-not (Test-Path -LiteralPath $plugin -PathType Container)) {
            throw "Expected VST3 bundle was not produced: $plugin"
          }
          $module = Get-ChildItem -LiteralPath $plugin -Recurse -Filter '*.vst3' -File
          if ($module.Count -lt 1) {
            throw "The VST3 bundle does not contain a module binary."
          }
          $standalone = Join-Path $env:GITHUB_WORKSPACE 'build\RandomChopSampler_artefacts\Release\Standalone\Random Chop Sampler.exe'
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf) -or
              (Get-Item -LiteralPath $standalone).Length -eq 0) {
            throw "Expected standalone executable was not produced: $standalone"
          }
          $requiredNotices = @(
            'THIRD_PARTY_NOTICES.md',
            'JUCE_LICENSE.md',
            'SIGNALSMITH_LINEAR_LICENSE.txt'
          )
          foreach ($noticeName in $requiredNotices) {
            $notice = Join-Path $plugin "Contents\Resources\$noticeName"
            if (-not (Test-Path -LiteralPath $notice -PathType Leaf) -or
                (Get-Item -LiteralPath $notice).Length -eq 0) {
              throw "The VST3 bundle is missing required notice: $noticeName"
            }
          }
          Write-Host "Verified $plugin"
          $module | ForEach-Object { Write-Host "Module: $($_.FullName) ($($_.Length) bytes)" }
          Write-Host "Standalone: $standalone ($((Get-Item -LiteralPath $standalone).Length) bytes)"

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: Random-Chop-Sampler-Windows-VST3
          # Upload the parent so the downloaded archive preserves the required
          # top-level "Random Chop Sampler.vst3" bundle directory.
          path: build/RandomChopSampler_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 30
